name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against mcp/sdk dev-main, so a breaking change in a pre-1.0
    # dependency surfaces here rather than in an application bump.
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      # The contract suite needs the real specs. It skips without them, so this
      # step is what makes it actually run.
      - name: Fetch OpenAPI specs
        continue-on-error: true
        run: |
          mkdir -p build/specs
          curl -fsS -o build/specs/openapi.yaml \
            https://my.interserver.net/spec/openapi.yaml || echo "client spec unavailable"
          curl -fsS -o build/specs/openapi-admin.yaml \
            https://my.interserver.net/admin/openapi-admin.yaml || echo "admin spec unavailable"

      - name: Tests
        env:
          MCP_CLIENT_SPEC: build/specs/openapi.yaml
          MCP_ADMIN_SPEC: build/specs/openapi-admin.yaml
        run: vendor/bin/phpunit

  sdk-dev-main:
    # The SDK is pre-1.0 and v0.8.0 alone carried three BC breaks. Both apps pin
    # an exact version through this package, so a break has to surface somewhere
    # deliberate. This is that place.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install against mcp/sdk dev-main
        run: |
          composer require --no-update --dev mcp/sdk:dev-main
          composer update --no-interaction --no-progress --with-all-dependencies
      - name: Tests
        run: vendor/bin/phpunit --testsuite Unit,Integration
